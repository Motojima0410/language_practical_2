<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>C画面-一覧画面</title>
    <link rel="stylesheet" href="layout.css" />
    <link rel="stylesheet" href="pageC.css" />
  </head>

  <body>
    <header>
      <div class="header-inner">
        <a href="pageA.html" class="nav-icon">🏠</a>
        <h1>メインメニュー</h1>
      </div>
    </header>

    <main>
      <div class="main-content">
        <h2>登録情報一覧</h2>
        <table id="data-table">
          <thead>
            <tr>
              <th>No.</th>
              <th>選択</th>
              <th>内容</th>
            </tr>
          </thead>

          <tbody id="table-body">
            <tr>
              <td>1</td>
              <td><input type="checkbox" class="row-check" /></td>
              <td>
                <input type="text" class="row-input" value="入力された内容" />
              </td>
            </tr>
          </tbody>
        </table>

        <button type="button" id="add-row-btn">行を追加</button>
        <button type="button" id="delete-row-btn">行を削除</button>
      </div>
    </main>

    <footer>
      <a href="pageA.html" class="footer-icon">🏠</a>
      <p>&copy; 2025 Web App Project</p>
    </footer>

    <script src="pageC.js"></script>
  </body>
</html>
