<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>スキル一覧</title>
</head>

<body>
  <p><a href="/users">ユーザー画面へ</a></p>
  <h1>スキル一覧</h1>

  <form action="/skills" method="get">
    <input type="text" name="skill" th:value="${skill}" placeholder="スキルで絞り込み">
    <button type="submit">検索</button>
  </form>
  <p>
    <a href="/skills?sort=skill">スキル順</a>
    <a href="/skills?sort=name">名前順</a>
  </p>

  <table border="1">
    <thead>
      <tr>
        <th>スキル</th>
        <th>名前</th>
        <th>編集</th>
        <th>削除</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="item : ${skills}">
        <td th:text="${item.skill}"></td>
        <td th:text="${item.name}"></td>
        <td>
          <form action="/skills/update" method="post">
            <input type="hidden" name="id" th:value="${item.id}">
            <input type="text" name="skill" th:value="${item.skill}">
            <button type="submit">更新</button>
          </form>
        </td>
        <td>
          <form action="/skills/delete" method="post">
            <input type="hidden" name="id" th:value="${item.id}">
            <button type="submit">削除</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>
  <p th:if="${skills.isEmpty()}">データがありません</p>

  <h2>スキル登録</h2>
  <form action="/skills" method="post">
    <input type="text" name="userId" placeholder="ユーザーID（数字）">
    <input type="text" name="skill" placeholder="スキル名">
    <button type="submit">登録</button>
  </form>
</body>

</html>
